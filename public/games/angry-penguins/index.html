<script>
(()=>{'use strict';
const cv=document.querySelector('#canvas'),ctx=cv.getContext('2d'),overlay=document.querySelector('#overlay'),hint=document.querySelector('#hint');
const ui={level:document.querySelector('#level'),birds:document.querySelector('#birds'),fish:document.querySelector('#fish'),score:document.querySelector('#score'),result:document.querySelector('#result'),play:document.querySelector('#play'),board:document.querySelector('#board')};
let W=0,H=0,D=1,S=1,OX=0,OY=0,last=0,state='ready',drag=false,settle=0,shotElapsed=0,level=0,totalFish=2,birds=3,score=0,levelStartScore=0,fish=0,combo=0,shake=0,lastWin=false;
let penguin,boxes=[],balls=[],particles=[];
let audioCtx=null,soundOn=true,lastImpactSound=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function audio(){if(!soundOn)return null;if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(freq,dur=.1,type='sine',vol=.05,slide=1,delay=0){let a=audio();if(!a)return;let t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*slide),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur=.15,vol=.035){let a=audio();if(!a)return;let n=Math.ceil(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);let s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol;s.connect(g).connect(a.destination);s.start()}
function sound(name,power=1){if(!soundOn)return;if(name==='launch')tone(310,.2,'triangle',.055,.42);else if(name==='impact'){let now=performance.now();if(now-lastImpactSound<85)return;lastImpactSound=now;tone(105+Math.min(power,500)*.12,.075,'square',.025,.65)}else if(name==='fish'){tone(620,.12,'sine',.06,1.35);tone(930,.16,'triangle',.045,1.15,.07)}else if(name==='collapse'){noise(.22,.04);tone(115,.28,'sawtooth',.045,.45)}else if(name==='boom'){noise(.35,.075);tone(75,.38,'square',.055,.45)}else if(name==='win'){tone(523,.15,'triangle',.055,1.02);tone(659,.18,'triangle',.05,1.02,.12);tone(784,.24,'triangle',.05,1.02,.25)}else if(name==='fail')tone(260,.34,'triangle',.045,.55)}
function resize(){D=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);S=Math.min(W/1100,H/650);OX=(W-1100*S)/2;OY=(H-650*S)/2}
addEventListener('resize',resize);
const X=x=>OX+x*S,Y=y=>OY+y*S;
function body(type,x,y,w,h,extra={}){return {type,x,y,w,h,spawnY:y,vx:0,vy:0,a:0,av:0,alive:true,hit:false,...extra}}
function reset(){birds=[3,3,4][level];totalFish=[2,3,3][level];fish=0;combo=0;settle=0;shotElapsed=0;shake=0;particles=[];balls=[];penguin=body('penguin',190,440,52,62,{r:27,active:false});
if(level===0){boxes=[body('ice',765,500,170,24,{hp:38}),body('wood',730,440,26,95,{hp:48}),body('wood',810,440,26,95,{hp:48}),body('wood',770,385,120,22,{hp:44}),body('fish',770,345,34,34,{hp:1}),body('fish',650,505,34,34,{hp:1}),body('seal',770,465,48,54,{hp:18})]}
else if(level===1){boxes=[body('ice',720,505,190,22,{hp:34}),body('wood',770,445,28,98,{hp:30}),body('wood',850,445,28,98,{hp:30}),body('wood',810,382,135,22,{hp:38}),body('fish',810,342,34,34,{hp:1}),body('fish',900,500,34,34,{hp:1}),body('fish',690,465,34,34,{hp:1}),body('seal',810,470,48,54,{hp:18})];balls.push(body('snowball',600,505,52,52,{r:26,sleeping:true}))}
else{boxes=[body('ice',700,505,150,22,{hp:38}),body('wood',745,445,28,100,{hp:50}),body('wood',825,445,28,100,{hp:50}),body('wood',785,380,135,22,{hp:46}),body('tnt',900,475,48,48,{hp:12}),body('wood',965,455,26,90,{hp:48}),body('fish',785,340,34,34,{hp:1}),body('fish',930,410,34,34,{hp:1}),body('fish',1010,500,34,34,{hp:1}),body('seal',785,470,48,54,{hp:18}),body('seal',985,490,48,54,{hp:18})];balls.push(body('snowball',610,505,52,52,{r:26,sleeping:true}))}
boxes.forEach(o=>o.sleeping=true);updateUI();hint.textContent=['Rescue the front fish, then knock down the tower!','Use the snowball to start a chain reaction!','Trigger the fish barrel and rescue all three!'][level]}
function updateUI(){ui.level.textContent=level+1;ui.birds.textContent=birds;ui.fish.textContent=fish+'/'+totalFish;ui.score.textContent=score}
function launch(dx,dy){if(penguin.active||birds<=0)return;let power=clamp(Math.hypot(dx,dy),0,145);if(power<18)return;penguin.vx=-dx/power*power*12.5;penguin.vy=-dy/power*power*12.5;penguin.active=true;shotElapsed=0;birds--;hint.style.opacity=0;sound('launch');updateUI()}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-190,190),vy:rnd(-250,20),life:rnd(.45,1),t:0,color,r:rnd(3,8)})}
function wakeStructure(x,y,r=260){for(const q of boxes){if(!q.alive||Math.hypot(q.x-x,q.y-y)>=r)continue;if(q.type==='fish'){if(q.y<490&&q.sleeping){q.sleeping=false;q.vx+=(q.x>=x?1:-1)*85;q.vy=-35}}else q.sleeping=false}}
function collapseStructure(hitX){let dir=hitX<810?1:-1;for(const q of boxes){if(!q.alive)continue;if(q.type==='fish'){if(q.y<490){q.sleeping=false;q.vx+=dir*125;q.vy=-55}}else if(q.y<500){q.sleeping=false;q.vx+=dir*(q.w>q.h?280:135);q.vy-=65;q.av+=dir*(q.w>q.h?2.2:1.1)}}}
function hit(o,force,vx,vy){if(!o.alive)return;o.sleeping=false;if(o.type==='fish'){o.alive=false;fish++;score+=500+combo*40;combo++;sound('fish');burst(o.x,o.y,'#ffd651',18);updateUI();return}if(force>18)wakeStructure(o.x,o.y);if(o.type==='seal'){o.vx+=vx*.42;o.vy+=vy*.25;o.hp-=force*.10;if(o.hp<=0&&!o.hit){o.hit=true;score+=250;combo++;burst(o.x,o.y,'#eafcff',14)}}else{let support=o.type==='wood'&&o.h>=90;if(support&&force>90)o.hp=0;else o.hp-=force*.06;o.vx+=vx*(o.w>o.h?.18:.12);o.vy+=vy*.08;if(o.type==='wood'&&o.w>o.h&&force>70)o.av+=(vx>=0?1:-1)*1.4;if(o.hp<=0){o.alive=false;wakeStructure(o.x,o.y,320);if(support){sound('collapse');collapseStructure(o.x)}score+=o.type==='tnt'?400:100;combo++;burst(o.x,o.y,o.type==='tnt'?'#ff8445':o.type==='ice'?'#bff5ff':'#c8894a',20);if(o.type==='tnt')explode(o.x,o.y)}}updateUI()}
function explode(x,y){shake=1;sound('boom');for(const o of [...boxes,...balls]){if(!o.alive)continue;let dx=o.x-x,dy=o.y-y,d=Math.max(30,Math.hypot(dx,dy));if(d<190){let p=(190-d)*5;o.vx+=dx/d*p;o.vy+=dy/d*p-150;hit(o,p,o.vx,o.vy)}}for(let i=0;i<45;i++)particles.push({x,y,vx:rnd(-420,420),vy:rnd(-480,120),life:rnd(.45,1.2),t:0,color:i%2?'#ffdf63':'#ff7743',r:rnd(4,11)})}
function circleRect(c,o){let cx=clamp(c.x,o.x-o.w/2,o.x+o.w/2),cy=clamp(c.y,o.y-o.h/2,o.y+o.h/2),dx=c.x-cx,dy=c.y-cy,d=Math.hypot(dx,dy);if(d<c.r){let nx=d?dx/d:0,ny=d?dy/d:-1,p=c.r-d;c.x+=nx*p;c.y+=ny*p;let rel=c.vx*nx+c.vy*ny;if(rel<0){c.vx-=1.45*rel*nx;c.vy-=1.45*rel*ny}let f=Math.abs(rel);if(f>45)sound('impact',f);hit(o,f,c.vx,c.vy);if(o.alive){o.vx+=nx*f*.09;o.vy+=ny*f*.07}return true}return false}
function physics(o,dt){if(!o.alive||o.sleeping)return;o.vy+=780*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=o.av*dt;o.vx*=Math.pow(.985,dt*60);o.av*=Math.pow(.98,dt*60);let ground=o.type==='snowball'?531-o.r:542-o.h/2;if(o.y>ground){o.y=ground;o.vy*=-.27;o.vx*=o.type==='snowball'?.987:.78;if(Math.abs(o.vy)<15)o.vy=0}if(o.x>1150||o.y>720||o.x<-100)o.alive=false}
function update(dt){shake*=Math.pow(.02,dt);for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt}particles=particles.filter(p=>p.t<p.life);
if(state!=='play')return;
if(penguin.active)shotElapsed+=dt;
if(penguin.active){physics(penguin,dt);for(const o of boxes)circleRect(penguin,o);for(const b of balls){let dx=b.x-penguin.x,dy=b.y-penguin.y,d=Math.hypot(dx,dy);if(d<penguin.r+b.r){let nx=dx/(d||1),ny=dy/(d||1),f=Math.abs(penguin.vx*nx+penguin.vy*ny);b.sleeping=false;b.vx+=nx*f*.9;b.vy+=ny*f*.8;penguin.vx-=nx*f*.35;penguin.vy-=ny*f*.35}}}
for(const b of balls){physics(b,dt);if(!b.sleeping)for(const o of boxes)circleRect(b,o)}
for(const o of boxes){if(!o.alive)continue;if(['fish'].includes(o.type))continue;physics(o,dt);for(const q of boxes){if(o===q||!q.alive||q.type==='fish')continue;let dx=Math.abs(o.x-q.x),dy=(o.y+o.h/2)-(q.y-q.h/2);if(dx<(o.w+q.w)/2&&dy>0&&dy<22&&o.vy>=0){o.y=q.y-q.h/2-o.h/2;o.vy=0;o.vx*=.96}}
if(o.type==='seal'&&o.hit&&Math.abs(o.vx)+Math.abs(o.vy)<18){o.alive=false;burst(o.x,o.y,'#dff9ff',12)}}
for(const f of boxes.filter(x=>x.type==='fish'&&x.alive)){if(!f.sleeping){physics(f,dt);if(f.spawnY<490&&f.y>=524){hit(f,100,f.vx,f.vy);continue}}for(const m of [penguin,...balls,...boxes.filter(x=>x!==f&&x.alive&&x.type!=='fish')]){let speed=Math.hypot(m.vx,m.vy),touch=m.r?Math.hypot(m.x-f.x,m.y-f.y)<m.r+17:Math.abs(m.x-f.x)<m.w/2+17&&Math.abs(m.y-f.y)<m.h/2+17;if(touch&&speed>85){hit(f,100,m.vx,m.vy);break}}}
let moving=penguin.active&&penguin.alive&&(Math.abs(penguin.vx)+Math.abs(penguin.vy)>20)||balls.some(b=>b.alive&&!b.sleeping&&Math.abs(b.vx)+Math.abs(b.vy)>22)||boxes.some(o=>o.alive&&!o.sleeping&&Math.abs(o.vx)+Math.abs(o.vy)>25);settle=moving?0:settle+dt;
if(fish>=totalFish&&settle>.7)finish(true);else if(penguin.active&&(settle>1.1||shotElapsed>10)){if(birds>0){penguin=body('penguin',190,440,52,62,{r:27,active:false});combo=0;settle=0;shotElapsed=0;hint.textContent='Another try — pull, aim, and release!';hint.style.opacity=1}else finish(false)}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,r)}
function mountain(base,peak,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(X(-80),Y(520));for(let x=-80;x<1180;x+=150)ctx.lineTo(X(x+75),Y(peak+rnd(-18,18))),ctx.lineTo(X(x+150),Y(base));ctx.lineTo(X(1180),Y(560));ctx.closePath();ctx.fill()}
function penguinDraw(x,y,a=0){ctx.save();ctx.translate(X(x),Y(y));ctx.scale(S,S);ctx.rotate(a);ctx.fillStyle='#15364c';ctx.beginPath();ctx.ellipse(0,0,27,34,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(2,7,19,25,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffb13c';ctx.beginPath();ctx.moveTo(20,-7);ctx.lineTo(37,0);ctx.lineTo(20,5);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(9,-17,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#18364a';ctx.beginPath();ctx.arc(12,-18,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e24f32';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-16,-23);ctx.lineTo(18,-25);ctx.stroke();ctx.fillStyle='#e24f32';ctx.fillRect(-10,-34,23,10);ctx.restore()}
function drawObj(o){if(!o.alive)return;let x=X(o.x),y=Y(o.y);ctx.save();ctx.translate(x,y);ctx.scale(S,S);ctx.rotate(o.a);if(o.type==='wood'){ctx.fillStyle='#ae7042';rr(0,0,o.w,o.h,7);ctx.fill();ctx.strokeStyle='#754325';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle='#d69a63';ctx.beginPath();ctx.moveTo(-o.w/2+7,-o.h/2+8);ctx.lineTo(o.w/2-7,o.h/2-8);ctx.moveTo(o.w/2-7,-o.h/2+8);ctx.lineTo(-o.w/2+7,o.h/2-8);ctx.stroke()}else if(o.type==='ice'){ctx.fillStyle='#bff4ff';rr(0,0,o.w,o.h,7);ctx.fill();ctx.strokeStyle='#65c9df';ctx.lineWidth=4;ctx.stroke()}else if(o.type==='tnt'){ctx.fillStyle='#f14f3d';rr(0,0,o.w,o.h,8);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.fillText('FISH!',0,5)}else if(o.type==='fish'){ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐟',0,0)}else if(o.type==='seal'){ctx.fillStyle='#9bb5c4';ctx.beginPath();ctx.ellipse(0,3,24,27,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-6,6,0,Math.PI*2);ctx.arc(8,-6,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#213849';ctx.beginPath();ctx.arc(-7,-5,2.5,0,Math.PI*2);ctx.arc(7,-5,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#314756';ctx.beginPath();ctx.arc(0,5,5,0,Math.PI*2);ctx.fill()}ctx.restore()}
function render(){ctx.setTransform(D,0,0,D,0,0);ctx.clearRect(0,0,W,H);ctx.save();if(shake>.03)ctx.translate(rnd(-9,9)*shake,rnd(-8,8)*shake);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#67d1ed');g.addColorStop(.64,'#d9f9ff');g.addColorStop(.65,'#88dce8');g.addColorStop(1,'#258cae');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff5b0';ctx.beginPath();ctx.arc(X(920),Y(105),55*S,0,Math.PI*2);ctx.fill();mountain(430,185,'#aedfec');mountain(480,245,'#dff7fb');ctx.fillStyle='#ecfcff';ctx.fillRect(0,Y(535),W,H-Y(535));ctx.fillStyle='#a8e8f3';ctx.beginPath();ctx.moveTo(X(0),Y(555));ctx.lineTo(X(1100),Y(555));ctx.lineTo(X(1100),H);ctx.lineTo(X(0),H);ctx.fill();
ctx.strokeStyle='#815338';ctx.lineWidth=12*S;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(X(170),Y(505));ctx.lineTo(X(170),Y(405));ctx.moveTo(X(215),Y(505));ctx.lineTo(X(215),Y(405));ctx.stroke();
if(!penguin.active){let px=drag?penguin.x:190,py=drag?penguin.y:440;ctx.strokeStyle='#53321f';ctx.lineWidth=7*S;ctx.beginPath();ctx.moveTo(X(170),Y(420));ctx.lineTo(X(px),Y(py));ctx.lineTo(X(215),Y(420));ctx.stroke();if(drag){ctx.fillStyle='#fff8';for(let i=1;i<5;i++){let vx=(190-px)*12.5,vy=(440-py)*12.5,t=i*.19;ctx.beginPath();ctx.arc(X(px+vx*t),Y(py+vy*t+390*t*t),4*S,0,Math.PI*2);ctx.fill()}}}
for(const o of boxes)drawObj(o);for(const b of balls){if(!b.alive)continue;ctx.fillStyle='#f8fdff';ctx.strokeStyle='#9bdbe8';ctx.lineWidth=3*S;ctx.beginPath();ctx.arc(X(b.x),Y(b.y),b.r*S,0,Math.PI*2);ctx.fill();ctx.stroke()}if(penguin.alive)penguinDraw(penguin.x,penguin.y,Math.atan2(penguin.vy,penguin.vx)*.18);
for(const p of particles){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(X(p.x),Y(p.y),p.r*S,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}
async function finish(win){if(state!=='play')return;state='done';lastWin=win;sound(win?'win':'fail');let bonus=win?birds*500:0;score+=bonus;updateUI();ui.result.innerHTML=win?'Level '+(level+1)+' cleared! Score <b>'+score+'</b> ⭐':'So close! You rescued '+fish+' of '+totalFish+' fish.';ui.play.textContent=win&&level<2?'NEXT LEVEL':win?'PLAY AGAIN':'TRY AGAIN';overlay.classList.remove('hidden');if(win&&level===2){MiazPlayer.showSticker(overlay.querySelector('.card'),'angry-penguins',score);await MiazPlayer.submitScore('angry-penguins',score);MiazPlayer.renderLeaderboard('angry-penguins',ui.board)}}
async function start(){if(state==='ready'){state='naming';await MiazPlayer.ensureNickname();level=0;score=0;levelStartScore=0}else if(state==='done'&&lastWin){if(level<2){level++;levelStartScore=score}else{level=0;score=0;levelStartScore=0}}else if(state==='done'){score=levelStartScore}reset();state='play';ui.result.textContent='';ui.board.innerHTML='';overlay.classList.add('hidden');hint.style.opacity=1}
function point(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S}}
cv.addEventListener('pointerdown',e=>{if(state!=='play'||penguin.active)return;let p=point(e);if(Math.hypot(p.x-penguin.x,p.y-penguin.y)<65){drag=true;cv.setPointerCapture(e.pointerId)}});cv.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e),dx=p.x-190,dy=p.y-440,d=Math.hypot(dx,dy),m=Math.min(d,145);penguin.x=190+dx/(d||1)*m;penguin.y=440+dy/(d||1)*m});cv.addEventListener('pointerup',()=>{if(!drag)return;drag=false;launch(penguin.x-190,penguin.y-440)});
ui.play.addEventListener('click',start);document.querySelector('#restart').addEventListener('click',()=>{score=levelStartScore;reset();state='play';overlay.classList.add('hidden');hint.style.opacity=1});
document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';e.currentTarget.setAttribute('aria-pressed',String(soundOn));e.currentTarget.setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on');if(soundOn)tone(520,.08,'sine',.035,1.25)});
function frame(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(frame)}resize();reset();requestAnimationFrame(frame);
})();
</script>
