<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Rush</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05060d;overflow:hidden}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#eaf6ff;
  -webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%)}
.scan{position:absolute;inset:0;pointer-events:none;opacity:.2;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.10) 0 1px, rgba(0,0,0,0) 1px 3px)}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:flex-start;gap:12px;padding:16px 18px;pointer-events:none}
.stats{display:flex;gap:10px;align-items:flex-start}
.stats.right{flex-direction:column;align-items:flex-end}
.stat{display:flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:14px;
  background:rgba(10,14,28,.5);border:1px solid rgba(120,235,255,.22);
  box-shadow:0 6px 20px rgba(0,0,0,.35)}
.stat.small .val{font-size:15px}
.lbl{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:#7fd8ff;opacity:.85}
.val{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:#fff;
  text-shadow:0 0 14px rgba(120,230,255,.75)}
.val .unit{font-size:10px;margin-left:3px;opacity:.7;letter-spacing:.1em}
.val.coin{color:#ffd761;text-shadow:0 0 14px rgba(255,200,60,.8)}
.bar{width:170px;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;
  border:1px solid rgba(120,235,255,.2)}
.bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#4cf0ff,#b46bff 60%,#ff4bb0);
  box-shadow:0 0 12px rgba(140,200,255,.8)}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;
  letter-spacing:.08em;color:#bfe6ff;background:rgba(8,12,24,.5);
  border:1px solid rgba(120,235,255,.18);padding:7px 14px;border-radius:999px;
  transition:opacity .4s;pointer-events:none}
.hint.hide{opacity:0}
kbd{display:inline-block;padding:1px 6px;margin:0 1px;border-radius:6px;
  border:1px solid rgba(150,240,255,.4);background:rgba(20,30,55,.8);
  font:inherit;font-size:11px;color:#dff6ff}
.overlay{position:absolute;inset:0;display:grid;place-items:center;
  background:radial-gradient(80% 70% at 50% 45%, rgba(30,10,60,.55), rgba(4,6,14,.86));
  transition:opacity .35s, transform .35s}
.overlay.hidden{opacity:0;pointer-events:none;transform:scale(1.02)}
.card{text-align:center;padding:26px 34px;max-width:min(92vw,560px);max-height:92vh;overflow-y:auto}
.title{margin:0;font-size:clamp(34px,7vw,62px);letter-spacing:.14em;font-weight:900;
  background:linear-gradient(90deg,#5bf0ff,#c07bff 55%,#ff5bb0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:12px 0 18px;color:#cfe9ff;opacity:.88;font-size:14px;line-height:1.5}
.keys{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#9fd2f2;margin-bottom:18px}
.final{font-size:14px;color:#ffe9a8;margin-bottom:14px;line-height:1.6}
.final b{font-size:22px;color:#fff}
button{font:inherit;font-weight:800;letter-spacing:.16em;font-size:13px;color:#031018;
  padding:13px 26px;border-radius:999px;border:0;cursor:pointer;
  background:linear-gradient(90deg,#5bf0ff,#8affd1);box-shadow:0 0 24px rgba(90,240,255,.5)}
button:hover{filter:brightness(1.1)}
button:active{transform:translateY(1px)}
.sound-toggle{position:absolute;z-index:30;right:18px;bottom:18px;width:46px;height:46px;padding:0;border:1px solid rgba(120,235,255,.4);border-radius:50%;background:rgba(8,12,24,.72);color:#dff8ff;font-size:20px;letter-spacing:0;box-shadow:0 0 18px rgba(90,240,255,.25)}
@media (max-width:520px){.stat{padding:6px 10px}.val{font-size:19px}.bar{width:120px}}
</style>
</head>
<body>
<div id="game">
  <button class="sound-toggle" id="soundToggle" aria-label="Mute sound">🔊</button>
  <canvas id="cv"></canvas>
  <div class="vignette"></div>
  <div class="scan"></div>

  <div class="hud">
    <div class="stats left">
      <div class="stat"><span class="lbl">Score</span><span class="val" id="score">0</span></div>
      <div class="stat small"><span class="lbl">Distance</span><span class="val" id="dist">0 m</span></div>
    </div>
    <div class="stats right">
      <div class="stat"><span class="lbl">Speed</span><span class="val" id="speed">0<span class="unit">km/h</span></span></div>
      <div class="bar"><i id="speedbar"></i></div>
      <div class="stat small"><span class="lbl">Coins</span><span class="val coin" id="coins">0</span></div>
    </div>
  </div>

  <div class="hint" id="hint"><kbd>&#9664;</kbd><kbd>&#9654;</kbd> change lane &nbsp;&middot;&nbsp; <kbd>Space</kbd> start</div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h1 class="title">NEON RUSH</h1>
      <p class="sub" id="sub">Weave through traffic, grab the coins, don't crash.</p>
      <div class="keys">
        <span><kbd>&#8592;</kbd><kbd>&#8594;</kbd> or <kbd>A</kbd><kbd>D</kbd> &mdash; change lane</span>
        <span>on touch: tap the left or right half of the screen</span>
      </div>
      <div class="final" id="final"></div>
      <button id="startBtn">START ENGINE</button>
      <div id="raceLeaderboard"></div>
    </div>
  </div>
</div>

<script src="/games/shared/player-profile.js"></script>
<script>
(function(){
'use strict';

var cv  = document.getElementById('cv');
var ctx = cv.getContext('2d');
var soundOn = true, audio = null, engineOsc = null, engineGain = null;

function audioReady(){
  if (!soundOn) return null;
  var Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return null;
  if (!audio) audio = new Audio();
  if (audio.state === 'suspended') audio.resume();
  return audio;
}
function tone(freq, duration, type, volume, endFreq){
  var a = audioReady(); if (!a) return;
  var now=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,now); o.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq||freq),now+duration);
  g.gain.setValueAtTime(volume||.055,now); g.gain.exponentialRampToValueAtTime(.001,now+duration);
  o.connect(g).connect(a.destination); o.start(now); o.stop(now+duration);
}
function startEngine(){
  var a=audioReady(); if(!a)return;
  if(!engineOsc){ engineOsc=a.createOscillator(); engineGain=a.createGain(); engineOsc.type='sawtooth'; engineGain.gain.value=.001; engineOsc.connect(engineGain).connect(a.destination); engineOsc.start(); }
  engineGain.gain.cancelScheduledValues(a.currentTime); engineGain.gain.linearRampToValueAtTime(.025,a.currentTime+.25); tone(90,.38,'sawtooth',.07,210);
}
function stopEngine(){ if(audio&&engineGain){ engineGain.gain.cancelScheduledValues(audio.currentTime); engineGain.gain.linearRampToValueAtTime(.001,audio.currentTime+.25); } }

/* ---------------- tuning ---------------- */
var SEG_LEN    = 300;                 // world units per road segment
var RUMBLE_LEN = 2;                   // segments per stripe
var ROAD_W     = 1200;                // half-width of the road
var LANES      = 3;
var LANE_W     = (ROAD_W * 2) / LANES;
var LANE_CENTERS = [-LANE_W, 0, LANE_W];
var FOV        = 100;
var CAM_H      = 1000;
var CAM_DEPTH  = 1 / Math.tan((FOV / 2) * Math.PI / 180);
var DRAW_DIST  = 70;                  // segments drawn ahead
var PLAYER_Z   = CAM_H * CAM_DEPTH;   // player distance from camera
var MAX_SPEED  = SEG_LEN * 38;        // world units / second
var TOP_KMH    = 320;
var FAR_Z      = DRAW_DIST * SEG_LEN;

/* Collision is tested in world units at the player's plane. The band has to
   exceed the furthest the world can travel in one frame (speed x the dt clamp)
   or a car could be stepped clean over. */
var HIT_BAND   = SEG_LEN * 1.5;

/* Objects enter at the far edge of the fog and fade the rest of the way in, so
   the fixed spawn distance never announces itself. */
var SPAWN_REL  = FAR_Z * 0.80;
var FADE_LEN   = 4500;
var FOG_START  = FAR_Z * 0.50;
var FOG_END    = FAR_Z * 0.80;

/* Fairness budget. A wave never uses more than two of the three lanes, and no
   two waves land closer together than SPAWN_GAP, which is wider than
   WALL_BAND. Each car holds a constant pace, so cars keep their spacing for
   good. Together that means no stretch of road narrower than WALL_BAND can
   ever hold three blocked lanes: there is always a way through. spawnWave
   re-checks it anyway, as a backstop. */
var WALL_BAND  = SEG_LEN * 40;        // 12000 units, ~0.5s of travel at top speed
var SPAWN_GAP  = SEG_LEN * 60;        // 18000 units, comfortably clear of the band

var C = {
  road:   ['#15171f', '#191c26'],
  rumble: ['#f24b9a', '#f4f6ff'],
  lane:   '#b6f6ff',
  fog:    '#2a1c4a'
};

var CAR_PALS = [
  ['#7ef0ff', '#1f8fb0', '#0e2b3a'],
  ['#ff6fa8', '#a01f5e', '#3a0e28'],
  ['#ffd166', '#b8791d', '#3a280e'],
  ['#9d7bff', '#4b2fa8', '#1c1038'],
  ['#7dff9e', '#1f9e4d', '#0d3a1e'],
  ['#ff8a5c', '#b03f1f', '#3a170e']
];

/* ---------------- state ---------------- */
var W = 0, H = 0, DPR = 1, horizon = 0;

var G = {
  state: 'ready',      // ready | playing | crash | over
  cameraZ: 0,
  cameraX: 0,
  speed: 0,
  playerX: 0,
  targetLane: 1,
  roll: 0,
  coins: 0,
  score: 0,
  dist: 0,
  time: 0,
  spawnT: 0,
  crashT: 0,
  shake: 0,
  flash: 0
};

var objects = [];
var particles = [];

/* ---------------- helpers ---------------- */
var el = null, z0 = 0, last = 0, focal = 450;

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function hash(n){ var s = Math.sin(n * 127.1 + 13.7) * 43758.5453; return s - Math.floor(s); }
function rr(x, y, w, h, r){
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function quad(ax, ay, bx, by, cx, cy, dx, dy){
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.lineTo(cx, cy);
  ctx.lineTo(dx, dy);
  ctx.closePath();
  ctx.fill();
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || window.innerWidth;
  H = cv.clientHeight || window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  focal = clamp(W * 0.26, 110, H * 0.6);
  z0 = CAM_DEPTH * CAM_H;
  horizon = clamp(H * 0.90 - focal, H * 0.26, H * 0.60);
  if (ctx) buildSkyline();
}
window.addEventListener('resize', resize);

/* pseudo-3D projection; z is distance ahead of the camera */
function scaleAt(z){ return CAM_DEPTH / z; }
var z0 = CAM_DEPTH * CAM_H;              // nearest visible distance, set by FOV
function fogAt(z){
  return clamp((z - FOG_START) / (FOG_END - FOG_START), 0, 1);
}
function kmh(){ return Math.round((G.speed / MAX_SPEED) * TOP_KMH); }
function level(){ return 1 + Math.floor(G.dist / 1000); }

/* ---------------- objects ---------------- */
function resetWorld(){
  objects.length = 0;
  particles.length = 0;
  G.cameraZ = 0;
  G.cameraX = 0;
  G.speed = 0;
  G.playerX = 0;
  G.targetLane = 1;
  G.roll = 0;
  G.coins = 0;
  G.score = 0;
  G.dist = 0;
  G.time = 0;
  G.spawnT = 0;
  G.crashT = 0;
  G.shake = 0;
  G.flash = 0;
  waveZ = 0;
}

function addCar(lane, z, speed, pal){
  objects.push({
    kind: 'car', lane: lane, x: LANE_CENTERS[lane], z: z,
    speed: speed, pal: CAR_PALS[pal % CAR_PALS.length], dead: false
  });
}

function addCoin(lane, z){
  objects.push({
    kind: 'coin', lane: lane, x: LANE_CENTERS[lane], z: z,
    speed: 0, spin: hash(z) * 6.28, dead: false
  });
}

function addCoinRow(lane, z, n, step){
  step = step || SEG_LEN;
  for (var i = 0; i < n; i++) addCoin(lane, z + i * step);
}

function laneBlockedAhead(lane, z, win){
  for (var i = 0; i < objects.length; i++){
    var o = objects[i];
    if (o.dead || o.lane !== lane) continue;
    if (Math.abs(o.z - z) < win) return true;
  }
  return false;
}

/* Blocking the whole road is the one thing the spawner must never do. Before
   committing a lane, count how many lanes would be occupied in that z window;
   anything that would make it three gets skipped instead. */
function wallWouldForm(lane, z, win){
  var occupied = [false, false, false];
  occupied[lane] = true;
  for (var i = 0; i < objects.length; i++){
    var o = objects[i];
    if (o.dead || o.kind !== 'car') continue;
    if (Math.abs(o.z - z) < win) occupied[o.lane] = true;
  }
  return occupied[0] && occupied[1] && occupied[2];
}

/* Every car holds the same steady pace, slow enough that the player is always
   overtaking. Uniform speed is what makes the fairness guarantee below hold:
   cars keep their spacing forever, so two lanes that are clear when a wave
   spawns stay clear, and the road can never seal itself behind the player. */
var CAR_SLOW = 0.62;

/* Highest spawn position handed out so far, so waves stay SPAWN_GAP apart no
   matter how fast the world is scrolling. */
var waveZ = 0;

/* A wave drops one or two cars at the spawn line, never enough to block the
   road, then trails coins down a lane that is still open. */
function spawnWave(atZ){
  var lv = level();
  var z;
  if (atZ === undefined){
    z = Math.max(G.cameraZ + SPAWN_REL, waveZ + SPAWN_GAP);
    waveZ = z;
  } else {
    z = atZ;
    waveZ = Math.max(waveZ, z);
  }
  var free = [0, 1, 2];
  var carCount = (lv < 2) ? 1 : (Math.random() < 0.5 ? 2 : 1);

  for (var i = 0; i < carCount; i++){
    if (free.length <= 1) break;
    /* shuffle rather than pick, so a skipped lane is genuinely rerolled */
    var pick = Math.floor(Math.random() * free.length);
    var lane = free.splice(pick, 1)[0];
    var cz = z + (Math.random() - 0.5) * SEG_LEN * 2;
    if (laneBlockedAhead(lane, cz, SEG_LEN * 4)) continue;
    if (wallWouldForm(lane, cz, WALL_BAND)) continue;
    addCar(lane, cz, MAX_SPEED * CAR_SLOW, (Math.random() * 6) | 0);
  }

  /* Coins ride the wave's own z, so a car dropped a little ahead of the pack
     still reads as the same obstacle and the row never crosses it. */
  if (free.length){
    var cl = free[(Math.random() * free.length) | 0];
    addCoinRow(cl, z + SEG_LEN * 7, 4 + ((Math.random() * 5) | 0), SEG_LEN * 0.75);
  }
}

/* ---------------- particles ---------------- */
function burst(x, z, color, count, power){
  for (var i = 0; i < count; i++){
    var a = Math.random() * Math.PI * 2;
    var sp = (0.3 + Math.random()) * power;
    particles.push({
      x: x, z: z, y: Math.random() * 220,
      vx: Math.cos(a) * sp, vy: 60 + Math.random() * 320, vz: Math.sin(a) * sp * 0.6,
      life: 0.5 + Math.random() * 0.7, t: 0, color: color,
      size: 2 + Math.random() * 5
    });
  }
}

function updateParticles(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.t += dt;
    if (p.t >= p.life){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.z += p.vz * dt;
    p.y += p.vy * dt;
    p.vy -= 900 * dt;
    if (p.y < 0){ p.y = 0; p.vy *= -0.4; p.vx *= 0.7; p.vz *= 0.7; }
  }
}

/* ---------------- update ---------------- */
function update(dt){
  G.time += dt;
  G.shake *= Math.pow(0.0016, dt);
  G.flash *= Math.pow(0.0005, dt);

  updateParticles(dt);

  if (G.state === 'playing'){
    /* speed ramps with distance, and dips a little mid-lane-change */
    /* starts at ~211 km/h and works up to the 320 cap around the 3 km mark */
    var target = MAX_SPEED * clamp(0.66 + G.dist * 0.00011, 0.66, 1);
    var changing = Math.abs(LANE_CENTERS[G.targetLane] - G.playerX) > LANE_W * 0.35;
    var rate = (G.speed < target ? 0.7 : 1.6) * (changing ? 0.72 : 1);
    G.speed += (target - G.speed) * clamp(rate * dt, 0, 1);
    if (audio && engineOsc && soundOn) engineOsc.frequency.setTargetAtTime(70 + (G.speed / MAX_SPEED) * 95, audio.currentTime, .08);
  } else if (G.state === 'crash'){
    G.speed += (0 - G.speed) * clamp(3.2 * dt, 0, 1);
    G.crashT += dt;
    if (G.crashT > 1.2) gameOver();
  } else {
    G.speed += (0.16 * MAX_SPEED - G.speed) * clamp(0.8 * dt, 0, 1);
  }

  var dz = G.speed * dt;
  G.cameraZ += dz;
  if (G.state === 'playing') G.dist += dz * 0.0083;   // km/h <-> metres, near enough

  /* ease the car toward its lane center */
  var dx = LANE_CENTERS[G.targetLane] - G.playerX;
  G.playerX += dx * clamp(11 * dt, 0, 1);
  if (Math.abs(dx) < 1) G.playerX = LANE_CENTERS[G.targetLane];

  /* camera leans into the change and hugs the inside of the road */
  G.cameraX = G.playerX * 0.72;
  var rollTarget = clamp(dx / LANE_W, -1, 1) * -0.13;
  G.roll = lerp(G.roll, rollTarget, clamp(9 * dt, 0, 1));

  /* traffic and pickups move; the world scrolls past either way */
  var px = G.playerX;
  var playerPlaneZ = G.cameraZ + PLAYER_Z;
  for (var i = objects.length - 1; i >= 0; i--){
    var o = objects[i];
    o.z -= dz - o.speed * dt;
    if (o.z - G.cameraZ < -SEG_LEN * 4){ objects.splice(i, 1); continue; }
    if (G.state !== 'playing') continue;

    /* hit test in world units at the player's plane; the band is wider than one
       frame of travel, so nothing can be tunnelled through at top speed */
    if (Math.abs(o.z - playerPlaneZ) > HIT_BAND) continue;
    var gap = Math.abs(o.x - px);
    if (o.kind === 'coin'){
      if (gap < LANE_W * 0.78){
        burst(o.x, o.z, '#ffd761', 14, 90);
        objects.splice(i, 1);
        G.coins++;
        G.score += 25;
        tone(740 + (G.coins % 5) * 70, .09, 'triangle', .065, 1180);
        G.flash = Math.max(G.flash, 0.3);
      }
    } else if (gap < LANE_W * 0.52){
      crash(o);
      break;
    }
  }

  if (G.state === 'playing'){
    G.score += dz * 0.02;
    G.spawnT -= dt;
    if (G.spawnT <= 0){
      /* top up until the road is seeded as far as the spawn line again; the
         z gate inside spawnWave sets the real spacing */
      for (var w = 0; w < 3 && waveZ < G.cameraZ + SPAWN_REL; w++) spawnWave();
      G.spawnT = 0.1;
    }
  }

  updateHUD();
}

function crash(o){
  G.state = 'crash';
  G.crashT = 0;
  G.shake = 1;
  G.flash = 0.9;
  burst(o.x, o.z, '#ff9a3c', 34, 240);
  burst(o.x, o.z, '#fff1c4', 18, 300);
  burst(o.x, o.z, '#ff4b7d', 20, 160);
  tone(170, .48, 'sawtooth', .1, 42);
  stopEngine();
}

/* ---------------- render ---------------- */
function py(relZ, worldY){
  return horizon + (CAM_DEPTH / relZ) * (CAM_H - worldY) * focal;
}
function px2(relZ, worldX){
  return W / 2 + (CAM_DEPTH / relZ) * (worldX - G.cameraX) * focal;
}

function drawSky(){
  var g = ctx.createLinearGradient(0, 0, 0, horizon + 4);
  g.addColorStop(0,    '#070318');
  g.addColorStop(0.45, '#241048');
  g.addColorStop(0.78, '#5a1f63');
  g.addColorStop(1,    '#a83a6a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, horizon + 4);

  /* stars, with a lazy parallax drift */
  ctx.save();
  for (var i = 0; i < 55; i++){
    var sy = hash(i * 7.7) * horizon * 0.72;
    var sx = hash(i * 3.1) * W - G.cameraX * 0.012 - G.time * 3;
    sx = ((sx % W) + W) % W;
    var tw = 0.35 + 0.65 * Math.abs(Math.sin(G.time * 1.6 + i));
    ctx.globalAlpha = (1 - sy / horizon) * 0.85 * tw;
    ctx.fillStyle = i % 7 === 0 ? '#9fe8ff' : '#ffffff';
    var r = i % 11 === 0 ? 1.8 : 1.1;
    ctx.fillRect(sx, sy, r, r);
  }
  ctx.restore();

  /* synth sun */
  var sunR = Math.min(W, H) * 0.15;
  var sunX = W * 0.5 - G.cameraX * 0.03 * W / 2;
  var sunY = horizon - sunR * 0.30;
  var sg = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
  sg.addColorStop(0, '#ffe98a');
  sg.addColorStop(0.5, '#ff9a5c');
  sg.addColorStop(1, '#ff3d94');
  ctx.save();
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = sg;
  ctx.fillRect(sunX - sunR, sunY - sunR, sunR * 2, sunR * 2);
  /* dark bands across the lower half */
  ctx.fillStyle = 'rgba(20,6,40,0.92)';
  for (var b = 0; b < 7; b++){
    var bh = sunR * (0.045 + b * 0.028);
    ctx.fillRect(sunX - sunR, sunY + sunR * 0.12 + b * sunR * 0.135, sunR * 2, bh);
  }
  ctx.restore();
  /* bloom */
  var bg = ctx.createRadialGradient(sunX, sunY, sunR * 0.6, sunX, sunY, sunR * 2.3);
  bg.addColorStop(0, 'rgba(255,140,180,0.30)');
  bg.addColorStop(1, 'rgba(255,140,180,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(sunX - sunR * 2.3, sunY - sunR * 2.3, sunR * 4.6, sunR * 4.6);
}

/* The skyline is static apart from its scroll, so each layer is baked into a
   seamless tile once per resize and then blitted twice per frame. */
var skyTiles = [];

function buildSkyline(){
  skyTiles.length = 0;
  var defs = [
    { z: 30000, par: 0.055, col: '#170c33', lit: '#6fe6ff', hMin: 0.10, hVar: 0.32, base: 46, gap: 12 },
    { z: 12000, par: 0.170, col: '#0f0724', lit: '#ff7bd0', hMin: 0.14, hVar: 0.44, base: 78, gap: 20 }
  ];
  var scale = Math.min(DPR, 1.5);

  for (var L = 0; L < defs.length; L++){
    var d = defs[L];
    var step  = Math.max(9, (d.base + d.gap) * (focal / 450));
    var count = Math.ceil((W + step) / step) + 1;
    var tw = count * step;
    var th = horizon + focal * 0.25 + 40;
    var base = horizon + (CAM_DEPTH / d.z) * CAM_H * focal + 1;
    var wsize = Math.max(1.6, focal * 0.009);

    var c = document.createElement('canvas');
    c.width  = Math.max(1, Math.round(tw * scale));
    c.height = Math.max(1, Math.round(th * scale));
    var g = c.getContext('2d');
    g.scale(scale, scale);

    for (var i = 0; i < count; i++){
      var seed = i + L * 50;
      var bw = step * (0.60 + hash(seed * 1.7) * 0.30);
      var bh = Math.min(focal * (d.hMin + hash(seed * 5.3) * d.hVar), base - 4);
      var by = base - bh;

      g.fillStyle = d.col;
      g.fillRect(i * step, by, bw, bh + 2);
      if (hash(seed * 9.1) > 0.82){                       /* antenna */
        g.fillRect(i * step + bw * 0.47, by - focal * 0.06,
                   Math.max(1.4, focal * 0.007), focal * 0.06);
      }

      var cols = Math.max(2, Math.floor(bw / (wsize * 2.1)));
      var rows = Math.max(2, Math.floor(bh / (wsize * 2.4)));
      for (var cx = 0; cx < cols; cx++){
        for (var ry = 0; ry < rows; ry++){
          var k = hash(seed * 31.7 + cx * 7.3 + ry * 3.9);
          if (k < 0.72) continue;
          g.globalAlpha = 0.25 + k * 0.55;
          g.fillStyle = k > 0.94 ? '#fff3c4' : d.lit;
          g.fillRect(i * step + wsize * 1.2 + cx * wsize * 2.1,
                     by + wsize * 1.4 + ry * wsize * 2.4, wsize, wsize * 0.8);
        }
      }
      g.globalAlpha = 1;
    }

    skyTiles.push({ canvas: c, w: tw, h: th, par: d.par });
  }
}

function drawSkyline(){
  for (var L = 0; L < skyTiles.length; L++){
    var t = skyTiles[L];
    var off = (G.cameraZ * t.par + G.cameraX * t.par * 3) % t.w;
    if (off < 0) off += t.w;
    ctx.drawImage(t.canvas, -off, 0, t.w, t.h);
    ctx.drawImage(t.canvas, t.w - off, 0, t.w, t.h);
  }
}

function drawHorizonHaze(){
  var g = ctx.createLinearGradient(0, horizon - H * 0.16, 0, horizon + H * 0.05);
  g.addColorStop(0,    'rgba(168,58,106,0)');
  g.addColorStop(0.55, 'rgba(120,44,120,0.55)');
  g.addColorStop(1,    'rgba(58,20,80,0.98)');
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon - H * 0.16, W, H * 0.21);

  /* neon line where the road meets the sky */
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.shadowColor = '#7defff';
  ctx.shadowBlur = 26;
  ctx.fillStyle = '#cdfaff';
  ctx.fillRect(0, horizon - 1.5, W, 2);
  ctx.restore();
}

function drawGround(){
  var g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0,   '#3a1450');
  g.addColorStop(0.18,'#200d33');
  g.addColorStop(1,   '#0a0618');
  ctx.fillStyle = g;
  ctx.fillRect(0, horizon, W, H - horizon);
}

function drawRoad(){
  var baseSeg = Math.floor(G.cameraZ / SEG_LEN);
  var basePct = (G.cameraZ - baseSeg * SEG_LEN) / SEG_LEN;
  var far = DRAW_DIST * SEG_LEN;

  for (var n = 0; n < DRAW_DIST; n++){
    var z1 = z0 * 0.9 + n * SEG_LEN + basePct * SEG_LEN;
    var z2 = z1 + SEG_LEN;
    if (z1 > far) break;

    /* past the fog end every row is flat fog, so those are drawn once as a
       single band instead of one quad per segment */
    if (fogAt(z1) >= 1){
      var yf = py(z1, 0);
      ctx.fillStyle = C.fog;
      ctx.fillRect(0, yf, W, Math.max(1, horizon - yf));
      break;
    }

    var seg   = baseSeg + n;
    var alt   = Math.floor(seg / RUMBLE_LEN) % 2;
    var fog1  = fogAt(z1), fog2 = fogAt(z2);

    var y1  = py(z1, 0), y2 = py(z2, 0);
    var xl1 = px2(z1, -ROAD_W), xr1 = px2(z1, ROAD_W);
    var xl2 = px2(z2, -ROAD_W), xr2 = px2(z2, ROAD_W);
    var ph  = Math.max(1, y1 - y2);

    /* grass shoulder */
    ctx.fillStyle = alt ? '#1b0f33' : '#170c2c';
    ctx.fillRect(0, y2, W, ph + 1);

    /* road surface */
    ctx.fillStyle = C.road[alt];
    ctx.beginPath();
    ctx.moveTo(xl2, y2);
    ctx.lineTo(xr2, y2);
    ctx.lineTo(xr1, y1 + 1);
    ctx.lineTo(xl1, y1 + 1);
    ctx.closePath();
    ctx.fill();

    /* rumble strips */
    var rw1 = (ROAD_W - 950) / ROAD_W, rw2 = rw1;
    var rl1 = px2(z1, -ROAD_W), rl2 = px2(z1, -(ROAD_W - 130));
    var rr1 = px2(z1, ROAD_W - 130), rr2 = px2(z1, ROAD_W);
    var rl1f = px2(z2, -ROAD_W), rl2f = px2(z2, -(ROAD_W - 130));
    var rr1f = px2(z2, ROAD_W - 130), rr2f = px2(z2, ROAD_W);
    ctx.fillStyle = C.rumble[alt];
    quad(rl1f, y2, rl2f, y2, rl2, y1 + 1, rl1, y1 + 1);
    quad(rr1f, y2, rr2f, y2, rr2, y1 + 1, rr1, y1 + 1);

    /* lane dividers, dashed */
    if (alt === 0){
      ctx.fillStyle = C.lane;
      var lw = 22;
      for (var b = -1; b <= 1; b += 2){
        var bx = b * LANE_W / 2;
        var a1 = px2(z1, bx - lw), a2 = px2(z1, bx + lw);
        var c1 = px2(z2, bx - lw), c2 = px2(z2, bx + lw);
        quad(c1, y2, c2, y2, a2, y1 + 1, a1, y1 + 1);
      }
    }

    /* fog */
    if (fog1 > 0.002){
      ctx.globalAlpha = fog1;
      ctx.fillStyle = C.fog;
      ctx.beginPath();
      ctx.moveTo(xl2, y2);
      ctx.lineTo(xr2, y2);
      ctx.lineTo(xr1, y1 + 1);
      ctx.lineTo(xl1, y1 + 1);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(0, y2, W, ph + 1);
      ctx.globalAlpha = 1;
      if (fog2 > 0.98) break;
    }
  }
}

/* roadside light poles */
function drawProps(){
  var spacing = SEG_LEN * 18;
  var baseZ = Math.floor(G.cameraZ / spacing) * spacing;
  for (var k = 0; k < 9; k++){
    var z = baseZ + k * spacing;
    var rel = z - G.cameraZ;
    if (rel < z0 * 0.9 || rel > DRAW_DIST * SEG_LEN * 0.55) continue;
    var s = CAM_DEPTH / rel;
    var fog = 1 - fogAt(rel);

    for (var side = -1; side <= 1; side += 2){
      var bx = px2(rel, side * (ROAD_W + 260));
      var gy = py(rel, 0);
      var hh = s * 1500 * focal;
      var ww = Math.max(1.2, s * 60 * focal);
      ctx.globalAlpha = 0.9 * fog;
      ctx.fillStyle = '#2b2350';
      ctx.fillRect(bx - ww / 2, gy - hh, ww, hh);
      /* lamp head + glow */
      ctx.fillStyle = '#ffd9a0';
      ctx.fillRect(bx - ww * 1.6, gy - hh, ww * 3.2, Math.max(1.2, ww * 0.9));
      var gr = Math.max(6, s * 900 * focal);
      var gg = ctx.createRadialGradient(bx, gy - hh, 0, bx, gy - hh, gr);
      gg.addColorStop(0, 'rgba(255,200,130,0.5)');
      gg.addColorStop(1, 'rgba(255,200,130,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(bx - gr, gy - hh - gr, gr * 2, gr * 2);
      ctx.globalAlpha = 1;
    }
  }
}

function carShape(w, pal, alpha){
  var h = w * 0.6;
  var roofW = w * 0.62, roofH = h * 0.52;

  ctx.globalAlpha = alpha;

  /* contact shadow */
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.ellipse(0, 0, w * 0.56, Math.max(2, w * 0.14), 0, 0, Math.PI * 2);
  ctx.fill();

  /* wheels */
  ctx.fillStyle = '#0b0d14';
  rr(-w * 0.54, -h * 0.42, w * 0.16, h * 0.42, 3); ctx.fill();
  rr( w * 0.38, -h * 0.42, w * 0.16, h * 0.42, 3); ctx.fill();

  /* lower body */
  var bg = ctx.createLinearGradient(0, -h, 0, 0);
  bg.addColorStop(0, pal[0]);
  bg.addColorStop(0.55, pal[1]);
  bg.addColorStop(1, pal[2]);
  ctx.fillStyle = bg;
  rr(-w * 0.5, -h * 0.78, w, h * 0.78, w * 0.13);
  ctx.fill();

  /* cabin */
  ctx.fillStyle = pal[1];
  rr(-roofW / 2, -h * 0.78 - roofH * 0.62, roofW, roofH, w * 0.12);
  ctx.fill();

  /* rear window */
  var wg = ctx.createLinearGradient(0, -h * 1.1, 0, -h * 0.72);
  wg.addColorStop(0, 'rgba(170,225,255,0.92)');
  wg.addColorStop(1, 'rgba(40,70,110,0.95)');
  ctx.fillStyle = wg;
  rr(-roofW * 0.38, -h * 1.06, roofW * 0.76, roofH * 0.5, w * 0.1);
  ctx.fill();

  /* tail lights */
  ctx.shadowColor = '#ff2b4d';
  ctx.shadowBlur = w * 0.22;
  ctx.fillStyle = '#ff5566';
  rr(-w * 0.44, -h * 0.5, w * 0.26, h * 0.14, 3); ctx.fill();
  rr( w * 0.18, -h * 0.5, w * 0.26, h * 0.14, 3); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,225,235,0.85)';
  rr(-w * 0.42, -h * 0.485, w * 0.1, h * 0.07, 2); ctx.fill();
  rr( w * 0.32, -h * 0.485, w * 0.1, h * 0.07, 2); ctx.fill();

  /* bumper trim */
  ctx.fillStyle = 'rgba(10,14,24,0.75)';
  rr(-w * 0.5, -h * 0.13, w, h * 0.12, w * 0.05);
  ctx.fill();

  ctx.globalAlpha = 1;
}

function drawPlayerCar(){
  var rel = PLAYER_Z;
  var sx = px2(rel, G.playerX);
  var gy = py(rel, 0);
  var w  = (CAM_DEPTH / rel) * (LANE_W * 0.62) * focal;
  var h  = w * 0.6;

  /* neon underglow */
  var gr = w * 1.5;
  var gg = ctx.createRadialGradient(sx, gy, 0, sx, gy, gr);
  var pulse = 0.35 + 0.15 * Math.sin(G.time * 6);
  gg.addColorStop(0, 'rgba(90,240,255,' + pulse.toFixed(3) + ')');
  gg.addColorStop(1, 'rgba(90,240,255,0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.ellipse(sx, gy, gr, gr * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(sx, gy);
  ctx.rotate(G.roll * 0.5 + Math.sin(G.time * 1.7) * 0.004);
  ctx.shadowColor = 'rgba(110,240,255,0.85)';
  ctx.shadowBlur = w * 0.3;
  carShape(w * 1.06, ['#a8f7ff', '#2ba8cf', '#0c2436'], 1);
  ctx.restore();

  /* exhaust glow */
  var eg = ctx.createRadialGradient(sx, gy - h * 0.1, 0, sx, gy - h * 0.1, w * 0.5);
  eg.addColorStop(0, 'rgba(150,250,255,0.35)');
  eg.addColorStop(1, 'rgba(150,250,255,0)');
  ctx.fillStyle = eg;
  ctx.fillRect(sx - w, gy - h * 0.6, w * 2, h);
}

/* objects fade up as they cross the spawn line, so the fixed spawn distance
   never announces itself */
function fadeIn(rel){
  return clamp((SPAWN_REL + FADE_LEN - rel) / FADE_LEN, 0, 1);
}

function drawTraffic(){
  var list = [];
  for (var i = 0; i < objects.length; i++){
    var o = objects[i];
    var rel = o.z - G.cameraZ;
    if (rel < z0 * 0.85 || rel > DRAW_DIST * SEG_LEN * 0.92) continue;
    var op = fadeIn(rel);
    if (op <= 0.01) continue;
    list.push({ o: o, rel: rel, op: op });
  }
  list.sort(function(a, b){ return b.rel - a.rel; });

  for (var j = 0; j < list.length; j++){
    var o = list[j].o, rel = list[j].rel;
    var s = CAM_DEPTH / rel;
    var cx = px2(rel, o.x);
    var gy = py(rel, 0);
    var fog = (1 - fogAt(rel)) * list[j].op;
    if (fog <= 0.02) continue;

    if (o.kind === 'coin'){
      var cy = py(rel, 150);
      var r  = s * 190 * focal;
      if (r < 0.6) continue;
      var spin = G.time * 5 + o.spin;
      var rx = Math.abs(Math.cos(spin)) * r + r * 0.14;

      ctx.globalAlpha = fog;
      var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 3.2);
      cg.addColorStop(0, 'rgba(255,214,90,0.45)');
      cg.addColorStop(1, 'rgba(255,214,90,0)');
      ctx.fillStyle = cg;
      ctx.fillRect(cx - r * 3.2, cy - r * 3.2, r * 6.4, r * 6.4);

      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(0.8, rx), r, 0, 0, Math.PI * 2);
      var ig = ctx.createLinearGradient(cx - rx, cy - r, cx + rx, cy + r);
      ig.addColorStop(0, '#fff6c9');
      ig.addColorStop(0.45, '#ffd24a');
      ig.addColorStop(1, '#c98a10');
      ctx.fillStyle = ig;
      ctx.fill();
      if (rx > 2.5){
        ctx.strokeStyle = 'rgba(255,255,220,0.9)';
        ctx.lineWidth = Math.max(1, r * 0.14);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else {
      var w = s * (LANE_W * 0.62) * focal;
      if (w < 1.5) continue;
      ctx.save();
      ctx.translate(cx, gy);
      carShape(w, o.pal, fog);
      ctx.restore();
    }
  }
}

function drawParticles(){
  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    var rel = p.z - G.cameraZ;
    if (rel < 60 || rel > DRAW_DIST * SEG_LEN * 0.5) continue;
    var s = CAM_DEPTH / rel;
    var x = px2(rel, p.x);
    var y = py(rel, p.y - CAM_H);   /* particles carry a height above the road */
    var r = Math.max(1, s * p.size * focal * 0.9);
    var a = (1 - p.t / p.life) * (1 - fogAt(rel));
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSpeedLines(){
  var k = G.speed / MAX_SPEED;
  if (k < 0.15) return;
  ctx.save();
  ctx.globalAlpha = clamp((k - 0.15) * 0.9, 0, 0.7);
  for (var i = 0; i < 18; i++){
    var edge = (hash(i * 12.9) < 0.5 ? -1 : 1);
    var x = W / 2 + edge * (W * 0.30 + hash(i * 4.4) * W * 0.22);
    var len = H * (0.06 + hash(i * 8.8) * 0.16) * (0.5 + k);
    var t = (G.time * k * 2.4 + hash(i * 2.2)) % 1;
    var y = H * t;
    var g = ctx.createLinearGradient(0, y, 0, y + len);
    g.addColorStop(0, 'rgba(190,245,255,0)');
    g.addColorStop(0.5, 'rgba(220,250,255,0.9)');
    g.addColorStop(1, 'rgba(190,245,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, 1.6, len);
  }
  ctx.restore();
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (G.shake > 0.01){
    var m = G.shake * 22;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  drawSky();
  drawSkyline();
  drawGround();
  drawRoad();
  drawHorizonHaze();
  drawProps();
  drawTraffic();
  drawParticles();
  if (G.state !== 'crash' && G.state !== 'over') drawPlayerCar();
  drawSpeedLines();

  /* crash flash */
  if (G.flash > 0.01){
    ctx.globalAlpha = clamp(G.flash, 0, 1) * 0.75;
    ctx.fillStyle = '#fff2d0';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

/* ---------------- hud ---------------- */
el = {
  score:   document.getElementById('score'),
  dist:    document.getElementById('dist'),
  speed:   document.getElementById('speed'),
  coins:   document.getElementById('coins'),
  bar:     document.getElementById('speedbar'),
  hint:    document.getElementById('hint'),
  overlay: document.getElementById('overlay'),
  sub:     document.getElementById('sub'),
  final:   document.getElementById('final'),
  btn:     document.getElementById('startBtn')
};

var lastHud = { score: -1, dist: -1, speed: -1, coins: -1 };

function updateHUD(){
  var sc = Math.floor(G.score), di = Math.floor(G.dist), sp = kmh(), co = G.coins;
  if (sc !== lastHud.score){ el.score.textContent = sc; lastHud.score = sc; }
  if (di !== lastHud.dist){ el.dist.textContent = di + ' m'; lastHud.dist = di; }
  if (sp !== lastHud.speed){
    el.speed.innerHTML = sp + '<span class="unit">km/h</span>';
    el.bar.style.width = clamp((G.speed / MAX_SPEED) * 100, 0, 100).toFixed(1) + '%';
    lastHud.speed = sp;
  }
  if (co !== lastHud.coins){ el.coins.textContent = co; lastHud.coins = co; }
}

function loadBest(){
  try { return parseInt(localStorage.getItem('neonrush.best') || '0', 10) || 0; }
  catch (e){ return 0; }
}
function saveBest(v){
  try { localStorage.setItem('neonrush.best', String(v)); } catch (e){}
}

/* ---------------- flow ---------------- */
function startGame(){
  resetWorld();
  var oldReward = el.overlay.querySelector('.miaz-sticker-reward');
  if (oldReward) oldReward.remove();
  var oldBoard = document.getElementById('raceLeaderboard');
  oldBoard.className = '';
  oldBoard.innerHTML = '';
  G.state = 'playing';
  G.spawnT = 0.9;
  startEngine();
  el.overlay.classList.add('hidden');
  el.hint.classList.remove('hide');
  /* seed the road ahead so it is never empty; the same z gate sets the spacing */
  for (var i = 0; i < 8; i++) spawnWave();
}

async function gameOver(){
  G.state = 'over';
  var score = Math.floor(G.score);
  var best = loadBest();
  var isBest = score > best;
  if (isBest){ best = score; saveBest(best); }

  el.sub.textContent = isBest ? 'New personal best!' : 'Nice run. Try to beat it.';
  el.final.innerHTML =
    'Score <b>' + score + '</b> &nbsp;&middot;&nbsp; ' + Math.floor(G.dist) + ' m ' +
    '&nbsp;&middot;&nbsp; ' + G.coins + ' coins<br>' +
    '<span style="opacity:.75">Best ' + best + '</span>';
  el.btn.textContent = 'RESTART';
  el.overlay.classList.remove('hidden');
  el.hint.classList.add('hide');
  stopEngine();
  setTimeout(function(){ tone(330,.12,'triangle',.05,260); }, 80);
  MiazPlayer.showSticker(el.overlay.querySelector('.card'), 'neon-rush', score);
  await MiazPlayer.submitScore('neon-rush', score);
  MiazPlayer.renderLeaderboard('neon-rush', document.getElementById('raceLeaderboard'));
}

function shift(dir){
  if (G.state !== 'playing' && G.state !== 'ready') return;
  var n = G.targetLane + dir;
  if (n < 0 || n >= LANES) return;
  G.targetLane = n;
  tone(260 + n * 70, .045, 'square', .025, 380 + n * 70);
  el.hint.classList.add('hide');
}

async function beginOrRestart(){
  if (G.state === 'over' || G.state === 'ready'){
    await MiazPlayer.ensureNickname();
    startGame();
  }
}

/* ---------------- input ---------------- */
window.addEventListener('keydown', function(e){
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ shift(-1); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ shift(1); e.preventDefault(); }
  else if (k === ' ' || k === 'Spacebar' || k === 'Enter'){ beginOrRestart(); e.preventDefault(); }
});
el.btn.addEventListener('click', async function(e){ e.stopPropagation(); await MiazPlayer.ensureNickname(); startGame(); });
document.getElementById('soundToggle').addEventListener('click', function(e){
  e.stopPropagation(); soundOn=!soundOn; this.textContent=soundOn?'🔊':'🔇'; this.setAttribute('aria-label',soundOn?'Mute sound':'Unmute sound');
  if(soundOn){ startEngine(); if(G.state!=='playing') stopEngine(); } else stopEngine();
});

var game = document.getElementById('game');
game.addEventListener('pointerdown', function(e){
  if (G.state === 'over' || G.state === 'ready') return;   // the overlay button handles it
  shift(e.clientX < W / 2 ? -1 : 1);
});
game.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------------- loop ---------------- */
function frame(now){
  if (!last) last = now;
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;      // keep physics sane after a tab switch
  if (dt < 0) dt = 0;

  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
resize();
resetWorld();
el.final.innerHTML = '<span style="opacity:.75">Best ' + loadBest() + '</span>';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
