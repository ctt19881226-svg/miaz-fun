<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10133f">
  <meta name="description" content="接住星星，避开小雨滴！一款轻松可爱的儿童网页游戏。">
  <title>星星花园</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2310133f'/%3E%3Cpath d='m32 9 6.5 13.2 14.6 2.1-10.6 10.3 2.5 14.5L32 42.3 19 49.1l2.5-14.5L10.9 24.3l14.6-2.1z' fill='%23ffd84d'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box} :root{font-family:"Trebuchet MS","Microsoft YaHei",sans-serif;color:#fff;background:#10133f}
    body{margin:0;min-height:100svh;overflow:hidden;background:radial-gradient(circle at 50% 0,#343b91 0,#171b56 52%,#0b0e31 100%);touch-action:none;user-select:none}
    button{font:inherit}.shell{height:100svh;max-width:980px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:14px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{font-size:2.2rem;filter:drop-shadow(0 5px 8px #07092280)}h1{font-size:clamp(1.35rem,4vw,2rem);margin:0;letter-spacing:.05em}.scores{display:flex;gap:8px}.pill{min-width:82px;padding:8px 12px;border:2px solid #ffffff26;border-radius:18px;background:#080b2e99;box-shadow:inset 0 1px #ffffff22;text-align:center}.pill small{display:block;font-size:.75rem;color:#c8cbff}.pill strong{font-size:1.2rem;color:#fff}
    .game{position:relative;overflow:hidden;border:3px solid #ffffff2e;border-radius:28px;background:linear-gradient(#171c58aa,#21256855),radial-gradient(circle at 20% 15%,#fff 0 2px,transparent 3px),radial-gradient(circle at 72% 24%,#ffe77c 0 2px,transparent 3px),radial-gradient(circle at 45% 38%,#fff 0 1px,transparent 2px);background-size:auto,110px 110px,150px 150px,80px 80px;box-shadow:0 24px 60px #06081d90,inset 0 0 80px #6871df1d;min-height:360px}
    .moon{position:absolute;right:7%;top:7%;font-size:clamp(3rem,9vw,5.2rem);filter:drop-shadow(0 0 22px #fff3a0aa)}.cloud{position:absolute;font-size:clamp(2rem,6vw,3.4rem);opacity:.4;animation:drift 18s linear infinite}.cloud.a{top:20%;left:-10%}.cloud.b{top:48%;left:-20%;animation-duration:25s;animation-delay:-8s}@keyframes drift{to{transform:translateX(calc(100vw + 200px))}}
    .ground{position:absolute;left:-5%;right:-5%;bottom:-24px;height:90px;border-radius:50% 50% 0 0;background:linear-gradient(#394ac7,#202b86);box-shadow:inset 0 12px #8f98ff18}.basket{position:absolute;left:50%;bottom:34px;width:94px;height:62px;transform:translateX(-50%);font-size:62px;line-height:1;filter:drop-shadow(0 10px 8px #080a2f88);transition:font-size .25s,filter .12s}.basket.boost{filter:drop-shadow(0 0 16px #ffe35c) drop-shadow(0 10px 8px #080a2f88)}.basket.big{font-size:92px;width:140px;filter:drop-shadow(0 0 20px #79f3ff) drop-shadow(0 10px 8px #080a2f88)}
    .drop{position:absolute;top:-70px;width:54px;height:54px;display:grid;place-items:center;font-size:46px;filter:drop-shadow(0 7px 5px #080a2f66);will-change:transform}.drop.star,.drop.double{animation:twinkle .55s ease-in-out infinite alternate}.drop.double{filter:drop-shadow(0 0 13px #ffd84d) drop-shadow(0 7px 5px #080a2f66)}.drop.magnet,.drop.grow{animation:twinkle .4s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px #6ef4ff)}@keyframes twinkle{to{scale:1.12;rotate:9deg}}
    .burst{position:absolute;font-weight:900;color:#fff3a0;text-shadow:0 2px 0 #8c5800;animation:pop .65s ease-out forwards;pointer-events:none}@keyframes pop{to{transform:translateY(-55px) scale(1.4);opacity:0}}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#090c36aa;backdrop-filter:blur(7px);z-index:10}.card{width:min(480px,100%);padding:clamp(20px,5vw,34px);text-align:center;border:2px solid #ffffff36;border-radius:30px;background:linear-gradient(145deg,#303790ee,#171b55f5);box-shadow:0 24px 70px #030518aa,inset 0 1px #ffffff35}.hero-star{font-size:3.8rem;display:block;animation:bob 1.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-9px) rotate(8deg)}}.card h2{margin:6px 0 8px;font-size:clamp(1.7rem,6vw,2.5rem)}.card p{margin:0 0 16px;color:#dfe1ff;font-size:1rem;line-height:1.55}.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 18px;text-align:left}.legend span{padding:8px 10px;border-radius:12px;background:#ffffff10;border:1px solid #ffffff18;font-size:.88rem}.primary{border:0;border-radius:18px;padding:14px 30px;background:#ffd84d;color:#362600;font-weight:900;font-size:1.15rem;box-shadow:0 7px 0 #c98d16,0 12px 24px #06082477;cursor:pointer}.primary:active{transform:translateY(5px);box-shadow:0 2px 0 #c98d16}.hidden{display:none}.power-status{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;padding:7px 13px;border-radius:14px;background:#0b0e31cc;border:1px solid #75efff66;color:#bffaff;font-weight:900;box-shadow:0 5px 18px #05071f88}
    footer{display:flex;justify-content:center;align-items:center;gap:10px;color:#c8cbff;font-size:.9rem;text-align:center}.key{padding:3px 8px;border-radius:8px;background:#ffffff16;border:1px solid #ffffff22;color:#fff}.sound{position:absolute;right:14px;bottom:14px;border:1px solid #ffffff30;border-radius:50%;width:44px;height:44px;background:#0b0e31aa;color:#fff;font-size:1.2rem;cursor:pointer;z-index:4}
    @media(max-width:560px){.shell{padding-left:10px;padding-right:10px;gap:10px}.brand-mark{font-size:1.7rem}.pill{min-width:70px;padding:7px 8px}.pill small{font-size:.68rem}.game{border-radius:22px}.scores{gap:5px}.basket{font-size:56px;width:84px}.cloud{display:none}footer{font-size:.8rem}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><span class="brand-mark">🌟</span><h1>星星花园</h1></div><div class="scores"><div class="pill"><small>得分</small><strong id="score">0</strong></div><div class="pill"><small>剩余时间</small><strong><span id="time">40</span> 秒</strong></div></div></header>
    <section class="game" id="game" aria-label="星星花园游戏区域">
      <span class="moon">🌙</span><span class="cloud a">☁️</span><span class="cloud b">☁️</span><div class="ground"></div>
      <div class="power-status hidden" id="powerStatus"></div><div class="basket" id="basket" aria-label="接星星的小篮子">🧺</div><button class="sound" id="sound" aria-label="关闭声音">🔊</button>
      <div class="overlay" id="start"><div class="card"><span class="hero-star">⭐</span><h2>接住星星！</h2><p>移动篮子接宝物，小心雨滴。</p><div class="legend"><span>⭐ 普通星星 +1</span><span>🌟 金色星星 +2</span><span>🧲 吸走满屏星星</span><span>🪄 篮子变大 8 秒</span></div><button class="primary" id="play">开始游戏</button></div></div>
      <div class="overlay hidden" id="over"><div class="card"><span class="hero-star" id="resultIcon">🏆</span><h2 id="resultTitle">太棒啦！</h2><p>你收集了 <strong id="finalScore">0</strong> 颗星星</p><button class="primary" id="again">再玩一次</button></div></div>
    </section>
    <footer><span>拖动鼠标或手指</span><span>·</span><span class="key">←</span><span class="key">→</span><span>也可以移动</span></footer>
  </main>
<script src="/games/shared/player-profile.js"></script>
<script>
(() => {
  const game=document.querySelector('#game'),basket=document.querySelector('#basket'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time');
  const start=document.querySelector('#start'),over=document.querySelector('#over'),soundBtn=document.querySelector('#sound'),powerStatus=document.querySelector('#powerStatus');
  let running=false,score=0,time=40,x=.5,keys={},drops=[],spawnTimer=0,last=0,timerId,sound=true,audio,bigUntil=0;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function beep(freq=620,dur=.08,type='sine'){if(!sound)return;audio??=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
  function move(clientX){const r=game.getBoundingClientRect();x=clamp((clientX-r.left)/r.width,.07,.93);basket.style.left=(x*100)+'%'}
  game.addEventListener('pointermove',e=>{if(running)move(e.clientX)});game.addEventListener('pointerdown',e=>{if(running)move(e.clientX)});
  addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();keys[e.key]=true}});addEventListener('keyup',e=>keys[e.key]=false);
  function spawn(forcedType){const roll=Math.random();let type=forcedType||'star';if(!forcedType){if(roll<.18)type='rain';else if(roll<.32)type='double';else if(roll<.38)type='magnet';else if(roll<.44)type='grow'}const icons={star:'⭐',double:'🌟',rain:'💧',magnet:'🧲',grow:'🪄'},el=document.createElement('div');el.className='drop '+type;el.textContent=icons[type];const d={el,x:.07+Math.random()*.86,y:-.12,speed:.27+Math.random()*.22,type};el.style.left=(d.x*100)+'%';game.append(el);drops.push(d)}
  function burst(px,py,text){const b=document.createElement('div');b.className='burst';b.textContent=text;b.style.left=px+'px';b.style.top=py+'px';game.append(b);setTimeout(()=>b.remove(),700)}
  function collectAll(){let gained=0;for(let i=drops.length-1;i>=0;i--){if(['star','double'].includes(drops[i].type)){gained+=drops[i].type==='double'?2:1;drops[i].el.remove();drops.splice(i,1)}}score+=gained;scoreEl.textContent=score;burst(game.clientWidth/2,game.clientHeight/2,`满屏吸星 +${gained} ⭐`);beep(980,.22,'triangle');spawnTimer=Math.min(spawnTimer,.25);[280,620,980].forEach((delay,index)=>setTimeout(()=>{if(running)spawn(index===1?'double':'star')},delay))}
  function setBig(){bigUntil=performance.now()+8000;basket.classList.add('big');powerStatus.classList.remove('hidden');beep(440,.18,'triangle')}
  function tick(now){if(!running)return;const dt=Math.min((now-last)/1000,.035);last=now;if(keys.ArrowLeft) x=clamp(x-dt*.8,.07,.93);if(keys.ArrowRight)x=clamp(x+dt*.8,.07,.93);basket.style.left=x*100+'%';spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=.48+Math.random()*.35}
    const r=game.getBoundingClientRect(),basketY=r.height-92,big=now<bigUntil,catchWidth=big?92:62;if(big){powerStatus.textContent=`🪄 大篮子 ${Math.ceil((bigUntil-now)/1000)} 秒`}else{basket.classList.remove('big');powerStatus.classList.add('hidden')}
    for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.y+=d.speed*dt;d.el.style.transform=`translate(-50%, ${d.y*r.height}px)`;const px=d.x*r.width;if(d.y*r.height>basketY-15&&d.y*r.height<basketY+48&&Math.abs(px-x*r.width)<catchWidth){if(d.type==='star'||d.type==='double'){const pts=d.type==='double'?2:1;score+=pts;scoreEl.textContent=score;burst(px,basketY,`+${pts} ${d.type==='double'?'🌟':'⭐'}`);basket.classList.add('boost');setTimeout(()=>basket.classList.remove('boost'),140);beep(760+pts*100)}else if(d.type==='rain'){score=Math.max(0,score-2);scoreEl.textContent=score;burst(px,basketY,'-2 💧');beep(180,.16,'sawtooth')}else if(d.type==='magnet'){d.el.remove();drops.splice(i,1);collectAll();continue}else if(d.type==='grow'){setBig();burst(px,basketY,'大篮子！');}d.el.remove();drops.splice(i,1)}else if(d.y>1.12){d.el.remove();drops.splice(i,1)}}requestAnimationFrame(tick)}
  function begin(){drops.forEach(d=>d.el.remove());drops=[];score=0;time=40;x=.5;bigUntil=0;basket.classList.remove('big');powerStatus.classList.add('hidden');scoreEl.textContent='0';timeEl.textContent='40';basket.style.left='50%';start.classList.add('hidden');over.classList.add('hidden');running=true;spawnTimer=0;last=performance.now();beep(520,.1);clearInterval(timerId);timerId=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000);requestAnimationFrame(tick)}
  async function finish(){if(!running)return;running=false;clearInterval(timerId);drops.forEach(d=>d.el.remove());drops=[];document.querySelector('#finalScore').textContent=score;document.querySelector('#resultIcon').textContent=score>=25?'🏆':score>=12?'🌈':'🌱';document.querySelector('#resultTitle').textContent=score>=25?'星星冠军！':score>=12?'太棒啦！':'继续加油！';over.classList.remove('hidden');beep(520,.12);setTimeout(()=>beep(660,.15),130);MiazPlayer.showSticker(over.querySelector('.card'),'star-garden',score);await MiazPlayer.submitScore('star-garden',score);let board=over.querySelector('.miaz-leaderboard');if(!board){board=document.createElement('div');over.querySelector('.card').append(board)}MiazPlayer.renderLeaderboard('star-garden',board)}
  document.querySelector('#play').onclick=async()=>{await MiazPlayer.ensureNickname();begin()};document.querySelector('#again').onclick=async()=>{await MiazPlayer.ensureNickname();begin()};soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'🔊':'🔇';soundBtn.setAttribute('aria-label',sound?'关闭声音':'打开声音')};
  if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'start_star_game',title:'开始星星花园',description:'开始或重新开始一局星星花园游戏。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{begin();return{status:'started',timeSeconds:40}}})}catch(e){console.debug('WebMCP unavailable',e)}}
})();
</script>
</body></html>
